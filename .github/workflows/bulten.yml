name: Kamu İhale Bülteni (elle)

# KİK'in herkese açık günlük bültenlerinden ilanları toplar. Normalde "Tarama" iş akışının içinde çalışır;
# bu iş akışı elle çalıştırmak (ör. arşivi hızlı doldurmak) içindir.
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Arşivden en fazla kaç iş günü işlensin"
        required: false
        default: "20"
      probe:
        description: "Yalnızca yapı testi (veri yazmaz)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bulten
  cancel-in-progress: false

jobs:
  bulten:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pypdf requests
      - name: Bülten
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event.inputs.probe }}" = "true" ]; then python scraper/bulten.py --probe
          else python scraper/bulten.py --backfill "${{ github.event.inputs.backfill }}"; fi
