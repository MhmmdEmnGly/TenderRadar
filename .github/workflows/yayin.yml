name: Yayın (GitHub Pages)

# main dalına her gönderimde paneli GitHub Pages'e yayınlar.
# Yalnızca arayüz dosyaları yayınlanır; tarayıcı betikleri ve SQL dosyası yayına girmez. Veri Supabase'dedir.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site klasörünü hazırla
        run: |
          mkdir _site
          cp -r index.html sabah.html config.js assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
